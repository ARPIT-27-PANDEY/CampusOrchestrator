name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install packages from lock files
        run: |
          python -m pip install -U pip
          for s in library events cafeteria academics; do
            pip install -r services/${s}_mcp/requirements.lock -e "services/${s}_mcp[dev]"
          done
          pip install -r backend/requirements.lock -e "backend[dev]" ruff mypy pyyaml types-PyYAML
      - name: Lint
        run: |
          ruff format --check backend services tests evals
          ruff check backend services tests evals
      - name: Type check
        run: mypy backend/app services/*/[a-z]*_mcp evals/run_eval.py
      - name: MCP server tests
        run: for s in library events cafeteria academics; do (cd services/${s}_mcp && pytest -q) || exit 1; done
      - name: Backend tests
        run: cd backend && pytest -q
      - name: Integration tests (servers as separate processes over HTTP)
        run: pytest tests -q
      - name: Evaluation (mock LLM, deterministic)
        run: python -m evals.run_eval --out evals/reports/ci
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: eval-report
          path: evals/reports/ci/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  docker:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f infra/docker-compose.yml config --quiet
      - name: Build images
        run: docker compose -f infra/docker-compose.yml build
