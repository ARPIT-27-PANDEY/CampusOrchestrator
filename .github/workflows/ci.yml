name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# CI never needs a Groq key, campus credentials or a large model download. The only network access
# beyond package installs is fetching the curated official IIT Roorkee PDFs (17 allowlisted URLs on
# iitr.ac.in) when they are not committed; public-book APIs are replayed from recorded fixtures.

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install packages from lock files
        run: |
          python -m pip install -U pip
          for s in library events cafeteria academics; do
            pip install -r services/${s}_mcp/requirements.lock -e "services/${s}_mcp[dev]"
          done
          pip install -r backend/requirements.lock -e "backend[dev]" ruff mypy pyyaml types-PyYAML
      - name: Official IIT Roorkee documents (fetch only if not committed)
        run: cd services/academics_mcp && (python -m academics_mcp.sources check || python -m academics_mcp.sources fetch)
      - name: Lint
        run: |
          ruff format --check backend services tests evals
          ruff check backend services tests evals
      - name: Type check
        run: mypy backend/app services/*/[a-z]*_mcp evals/run_eval.py evals/run_retrieval.py evals/run_library_search.py evals/compare.py
      - name: MCP server tests
        run: for s in library events cafeteria academics; do (cd services/${s}_mcp && pytest -q) || exit 1; done
      - name: Backend tests (incl. security, trace privacy, timezone)
        run: cd backend && pytest -q
      - name: Integration tests (servers as separate processes over HTTP, extensibility)
        run: pytest tests -q
      - name: Agent evaluation v2 and v1 (mock provider, deterministic)
        run: |
          python -m evals.run_eval --out evals/reports/ci
          python -m evals.run_eval --dataset evals/datasets/campus_eval_v1.yaml --out evals/reports/ci
      - name: Retrieval benchmark (hashing and hybrid; FastEmbed is opt-in)
        run: python -m evals.run_retrieval --retrievers hashing,hybrid --tune --out evals/reports/ci
      - name: Library search benchmark (offline modes; FastEmbed is opt-in)
        run: python -m evals.run_library_search --modes keyword,hybrid-hashing --tune --out evals/reports/ci
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: eval-reports
          path: evals/reports/ci/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Official documents for the academics image
        run: |
          pip install -r services/academics_mcp/requirements.lock -e services/academics_mcp
          cd services/academics_mcp && (python -m academics_mcp.sources check || python -m academics_mcp.sources fetch)
      - name: Validate compose file
        run: docker compose -f infra/docker-compose.yml config --quiet
      - name: Build images
        run: docker compose -f infra/docker-compose.yml build
      - name: Build the Render image
        run: docker build -f infra/render/Dockerfile -t campusos-api-render .
