# Library catalogue search benchmark (keyword vs hybrid keyword + embedding search).
#
# Corpus: services/library_mcp/library_mcp/data/demo_books.json (138 Open Library-verified records;
# holdings are synthetic, which does not matter here: only titles, subjects and authors are searched).
#
# Labels are rules, not hand-picked rankings: a book is relevant when one of its catalogue subjects (or its
# discipline) is in `relevant_subjects`, or its id is in `relevant_ids`. The runner resolves and stores the
# ids per query, and fails if a rule resolves to nothing. `expect_empty: true` means the catalogue has no
# book on the topic, so the right result is an empty list (with suggestions at most).
#
# Splits: thresholds are tuned on `dev` only and then applied unchanged to `test`.
# Categories: title (known item), subject (the catalogue's own subject words), alias (student shorthand),
# paraphrase (the topic described in other words: what semantic search is for), author, negative.
version: 1
queries:
  # --------------------------------------------------------------- known-item titles
  - {id: t01, split: dev, category: title, query: "Introduction to Algorithms", relevant_ids: [LIB-1054]}
  - {id: t02, split: test, category: title, query: "Clean Code", relevant_ids: [LIB-1070]}
  - {id: t03, split: dev, category: title, query: "The Lean Startup", relevant_ids: [LIB-1105]}
  - {id: t04, split: test, category: title, query: "Signals and Systems", relevant_ids: [LIB-1023, LIB-1024]}
  - {id: t05, split: test, category: title, query: "Wings of Fire", relevant_ids: [LIB-1132]}
  - {id: t06, split: dev, category: title, query: "Sapiens", relevant_ids: [LIB-1114]}
  # --------------------------------------------------------------- subject words used by the catalogue
  - {id: s01, split: dev, category: subject, query: "thermodynamics", relevant_subjects: [thermodynamics]}
  - {id: s02, split: test, category: subject, query: "machine learning", relevant_subjects: [machine learning]}
  - {id: s03, split: dev, category: subject, query: "fluid mechanics", relevant_subjects: [fluid mechanics]}
  - {id: s04, split: test, category: subject, query: "operating systems", relevant_subjects: [operating systems]}
  - {id: s05, split: dev, category: subject, query: "probability", relevant_subjects: [probability]}
  - {id: s06, split: test, category: subject, query: "organic chemistry", relevant_subjects: [organic chemistry]}
  - {id: s07, split: dev, category: subject, query: "control systems", relevant_subjects: [control systems]}
  - {id: s08, split: test, category: subject, query: "geotechnical engineering", relevant_subjects: [geotechnical engineering]}
  # --------------------------------------------------------------- student shorthand
  - {id: a01, split: dev, category: alias, query: "dsa", relevant_subjects: [algorithms, data structures]}
  - {id: a02, split: test, category: alias, query: "som", relevant_subjects: [strength of materials, mechanics of materials]}
  - {id: a03, split: dev, category: alias, query: "dbms books", relevant_subjects: [databases]}
  - {id: a04, split: test, category: alias, query: "thermo", relevant_subjects: [thermodynamics]}
  # --------------------------------------------------------------- paraphrases (no catalogue subject word)
  - {id: p01, split: dev, category: paraphrase, query: "how heat moves through materials", relevant_subjects: [heat transfer]}
  - {id: p02, split: test, category: paraphrase, query: "protecting computers from hackers", relevant_subjects: [cybersecurity]}
