# Labelled retrieval benchmark over the official IIT Roorkee corpus (services/academics_mcp/data/iitr,
# manifest services/academics_mcp/data/sources/iitr_sources.yaml).
#
# Labels are written against the documents, not against any retriever's output:
#   relevant: [{doc, page, evidence, grade}]
#     A retrieved chunk is relevant with `grade` (2 = directly answers, 1 = related/partial) when it comes
#     from `doc` (manifest id), is on `page`, and its text contains `evidence` (case/whitespace-insensitive).
#     The runner checks that every evidence string exists in the indexed corpus before scoring and records
#     the resolved chunk ids in the report, so a chunking change cannot silently break the labels.
#   expect_abstain: true   no indexed document answers the question (insufficient-evidence cases)
#   split: dev | test      thresholds are tuned on dev only; headline numbers are reported on test
#   category: exact | paraphrase | synonym | numeric | multi_passage | short | long | no_answer |
#             superseded | misleading | applicability | injection
#   expect_current_first: the current document must rank above the superseded one
# The `injection` case uses a benchmark-only synthetic notice (see evals/run_retrieval.py), never the
# official corpus.
version: 1
corpus_manifest: services/academics_mcp/data/sources/iitr_sources.yaml
queries:
  # ---------------------------------------------------------------- attendance
  - {id: r01, split: dev, category: exact, query: "What is the attendance policy for students?",
     relevant: [{doc: iitr-attendance-policy-2024, page: 1, evidence: "required to attend every scheduled lecture", grade: 2},
                {doc: iitr-ug-ordinance-2025, page: 32, evidence: "expected to be present in every lecture", grade: 2}]}
  - {id: r02, split: test, category: paraphrase, query: "Can my professor give marks just for showing up to class?",
