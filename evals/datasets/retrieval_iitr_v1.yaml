  - {id: r03, split: test, category: numeric, query: "What percentage of marks can be assigned for attendance?",
     relevant: [{doc: iitr-attendance-policy-2024, page: 1, evidence: "10% of marks", grade: 2},
                {doc: iitr-ug-ordinance-2025, page: 32, evidence: "10% of marks", grade: 2}]}
  - {id: r04, split: test, category: misleading, query: "Does IIT Roorkee require 75% attendance to sit in exams?",
