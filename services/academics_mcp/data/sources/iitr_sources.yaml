# Curated IIT Roorkee academic sources for the Academics MCP server.
#
# Hand-maintained metadata. Fetch results (sha256, retrieval time, size, page/text counts, status)
# are written by `python -m academics_mcp.sources fetch` to iitr_sources.lock.json next to this file.
# Titles, issue numbers and dates are copied from the listing pages named in `listed_on`.
#
# Only URLs on the hosts in `allowed_hosts` are ever downloaded; this is not a crawler.
#
# Fields
#   id               stable id (also the PDF file name: <id>.pdf)
#   title            official title as listed by IIT Roorkee
#   authority        issuing body
#   doc_type         regulation | notification | calendar
#   url              canonical PDF URL
#   listed_on        official page that links the PDF
#   issued           issue date (YYYY-MM-DD) as printed in the listing, or null if not stated
#   reference        circular / Senate item number, if stated
#   effective        effective date or academic year, if stated (null = not stated)
#   academic_year    academic year the document is for, if it is year-specific
#   applies_to       programmes / students the document addresses (from its title; "all" if not limited)
#   status           current | superseded | uncertain
#   supersedes / superseded_by   ids of related documents, when the relation is established
#   usage_note       why we may use it
version: 1
authority_default: "Academic Affairs Office, IIT Roorkee"
allowed_hosts: [iitr.ac.in, www.iitr.ac.in]
usage_note_default: >-
  Public document published by IIT Roorkee on iitr.ac.in for students. Redistributed unmodified for
  retrieval with attribution and a link to the official URL. The official URL is authoritative.

