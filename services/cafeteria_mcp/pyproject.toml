[project]
name = "campusos-cafeteria-mcp"
version = "0.1.0"
description = "CampusOS cafeteria MCP server (demo, JSON and PDF menu providers)"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "pydantic>=2.14,<3",
  "uvicorn>=0.54,<1",
  "tzdata>=2024.1",
  "pymupdf==2.0",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2"]

[project.scripts]
cafeteria-mcp = "cafeteria_mcp.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cafeteria_mcp*"]

[tool.setuptools.package-data]
cafeteria_mcp = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
