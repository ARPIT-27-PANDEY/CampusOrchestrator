[project]
name = "campusos-backend"
version = "0.1.0"
description = "CampusOS AI backend: FastAPI, MCP client manager, agent orchestrator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.161,<0.162",
  "uvicorn[standard]>=0.54,<1",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "mcp==2.3.0",
  "openai>=3.37,<4",
  "httpx>=0.28,<1",
  "jsonschema>=4.26,<5",
  "structlog>=26.1,<27",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "respx>=0.23,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
