# Render Blueprint for CampusOrchestrator. In the Render dashboard: New > Blueprint > pick this repo.
#
# Two web services:
#   campusos-api  backend + the four MCP servers in one container (infra/render/Dockerfile)
#   campusos-web  Next.js frontend (frontend/Dockerfile). The browser only talks to this origin; its
#                 /api/* route handler proxies to BACKEND_URL server-side, so the session cookie is
#                 first-party and no CORS is involved.
#
# The URLs below are the services' real Render addresses (Render added the -xf3c / -c9o7
# suffixes because the plain names were taken). If you recreate the Blueprint, the suffixes
# change: update CORS_ORIGINS and BACKEND_URL to the new URLs. See DEPLOY.md.
#
# Access control: the API refuses to start in production without ACCESS_MODE=password (or an explicit
# ALLOW_OPEN_ACCESS=true). Set ACCESS_PASSWORD in the dashboard; SESSION_SECRET is generated by Render.
services:
  - type: web
    name: campusos-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: groq            # "mock" runs without a key (canned offline answers)
      - key: GROQ_API_KEY
        sync: false            # Render asks for this when you create the Blueprint
      - key: ACCESS_MODE
        value: password
      - key: ACCESS_PASSWORD
        sync: false            # the shared password students type; at least 8 characters
      - key: SESSION_SECRET
        generateValue: true    # random secret that signs session cookies
      - key: CORS_ORIGINS      # allowed Origin for sign-in and chat requests (the web service)
        value: https://campusos-web-c9o7.onrender.com
      - key: TRUSTED_PROXY_HOPS  # Render's load balancer in front of the web proxy and of the API
        value: "2"
      - key: CAMPUS_TIMEZONE
        value: Asia/Kolkata
      # Search stays lexical here: FastEmbed adds ~150-250 MB per process (academics and library each load
      # the model), and this container already uses ~425 MB of the free plan's 512 MB. On a plan with
      # >= 1 GB, build with INSTALL_FASTEMBED=1 and set fastembed / hybrid (see DEPLOY.md).
      - key: GOOGLE_BOOKS_API_KEY  # optional: turns on Google Books in public book discovery
        sync: false
      - key: EMBEDDING_PROVIDER
        value: hashing
      - key: RETRIEVAL_MODE
        value: dense
      - key: LIBRARY_SEARCH_MODE
        value: keyword
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: campusos-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Server-side only (read at request time by the /api proxy); never sent to the browser.
      - key: BACKEND_URL
        value: https://campusos-api-xf3c.onrender.com
