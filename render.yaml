# Render Blueprint for CampusOS AI. In the Render dashboard: New > Blueprint > pick this repo.
#
# Two web services:
#   campusos-api  backend + the four MCP servers in one container (infra/render/Dockerfile)
#   campusos-web  Next.js frontend (frontend/Dockerfile)
#
# The two URLs below assume Render gives the services these exact names. If a name is taken,
# Render adds a suffix (e.g. campusos-api-a1b2.onrender.com). Then update CORS_ORIGINS on
# campusos-api and NEXT_PUBLIC_API_BASE_URL on campusos-web to the real URLs and redeploy.
# See DEPLOY.md.
services:
  - type: web
    name: campusos-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: groq            # "mock" runs without a key (canned offline answers)
      - key: GROQ_API_KEY
        sync: false            # Render asks for this when you create the Blueprint
      - key: CORS_ORIGINS
        value: https://campusos-web.onrender.com
      - key: LOG_LEVEL
        value: INFO
      - key: CAMPUS_TIMEZONE
        value: Asia/Kolkata

  - type: web
    name: campusos-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Baked into the browser bundle at build time (Render passes env vars as Docker build args).
      # Changing it requires a redeploy of this service.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://campusos-api.onrender.com
