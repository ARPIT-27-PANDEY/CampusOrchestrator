# Render Blueprint for CampusOS AI. In the Render dashboard: New > Blueprint > pick this repo.
#
# Two web services:
#   campusos-api  backend + the four MCP servers in one container (infra/render/Dockerfile)
#   campusos-web  Next.js frontend (frontend/Dockerfile)
#
# The two URLs below are the services' real Render addresses (Render added the -xf3c / -c9o7
# suffixes because the plain names were taken). If you recreate the Blueprint, the suffixes
# change: update CORS_ORIGINS and NEXT_PUBLIC_API_BASE_URL to the new URLs. See DEPLOY.md.
services:
  - type: web
    name: campusos-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: groq            # "mock" runs without a key (canned offline answers)
      - key: GROQ_API_KEY
        sync: false            # Render asks for this when you create the Blueprint
      - key: CORS_ORIGINS
        value: https://campusos-web-c9o7.onrender.com
      - key: LOG_LEVEL
        value: INFO
      - key: CAMPUS_TIMEZONE
        value: Asia/Kolkata

  - type: web
    name: campusos-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Baked into the browser bundle at build time (Render passes env vars as Docker build args).
      # Changing it requires a redeploy of this service.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://campusos-api-xf3c.onrender.com
